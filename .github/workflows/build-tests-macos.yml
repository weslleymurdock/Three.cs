name: Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test 
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Restore local .NET tools
        shell: pwsh
        run: dotnet tool restore

      - name: Verify Three.js runtime assets integrity
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Sync-ThreeRuntime.ps1 -Check

      - name: Restore solution dependencies
        shell: pwsh
        run: dotnet restore Three.cs.slnx

      - name: Build solution (Release)
        shell: pwsh
        run: dotnet build Three.cs.slnx --configuration Release --no-restore

      - name: Run unit & integration tests with coverage
        shell: pwsh
        run: >
          dotnet test Three.cs.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      - name: Generate coverage reports (ReportGenerator 5.5.12)
        shell: pwsh
        run: >
          dotnet tool run reportgenerator
          "-reports:artifacts/test-results/**/coverage.cobertura.xml"
          "-targetdir:artifacts/coverage"
          "-reporttypes:MarkdownSummary;TextSummary"

      - name: Evaluate Quality Gate and Publish Summary
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Evaluate-QualityGate.ps1

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results-macos
          path: artifacts/test-results
          retention-days: 14

      - name: Upload Coverage Report Artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report-macos
          path: artifacts/coverage
          retention-days: 14
